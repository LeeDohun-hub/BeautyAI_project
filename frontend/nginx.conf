# 프로덕션 정적 서빙 + 백엔드 프록시.
#
# 프론트가 /api 를 **같은 오리진**으로 호출하게 해서 API URL 을 번들에 굽지 않는다.
# (Vite 는 import.meta.env 를 빌드 시점에 치환하므로, URL 을 구우면 환경마다 이미지를
#  다시 빌드해야 한다. 프록시를 두면 이미지 하나로 어느 환경에나 올린다.)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 해시가 붙은 정적 자산은 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 캐시하면 새 배포가 반영되지 않는다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;   # 얼굴·바디 사진 업로드
        proxy_read_timeout 120s;    # CPU 추론이 느릴 수 있다
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # SPA — 나머지는 전부 index.html 로 넘긴다(새로고침 404 방지).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
