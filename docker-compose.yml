services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: beautyai
      MYSQL_USER: beautyai
      MYSQL_PASSWORD: beautyai
      MYSQL_ROOT_PASSWORD: beautyai_root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://beautyai:beautyai@mysql:3306/beautyai
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:

