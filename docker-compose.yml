services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: beautyai
      MYSQL_USER: beautyai
      MYSQL_PASSWORD: beautyai
      MYSQL_ROOT_PASSWORD: beautyai_root
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pbeautyai_root"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      # .env 의 DATABASE_URL(운영 Supabase)을 상속한다. 없으면 로컬 mysql 로 폴백.
      # 로컬 mysql 은 seed 데모(상품 25개)뿐이라, 실제 카탈로그(바디 포함)는 Supabase 에 있다.
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://beautyai:beautyai@mysql:3306/beautyai}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      RAKUTEN_APP_ID: ${RAKUTEN_APP_ID:-}
      RAKUTEN_ACCESS_KEY: ${RAKUTEN_ACCESS_KEY:-}
      RAKUTEN_REFERER: ${RAKUTEN_REFERER:-http://127.0.0.1:5173/}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      SKIN_MODEL_PATH: /data/models/skin_efficientnet_b0.pt
      BODY_SKIN_MODEL_PATH: /data/models/body_skin_mobilenet_v3.pt
      PERSONAL_COLOR_MODEL_PATH: /data/models/personal_color_retrain_try2_smooth005.pt
    volumes:
      # 컨테이너 안에서 config.project_root(=parents[3])는 '/'로 해석된다
      # (WORKDIR=/app, 코드=/app/app/...). 따라서 기본 경로 ./data/... 는 /data/... 가 된다.
      # 모델·RAG가 로드되려면 마운트가 반드시 /data 여야 한다(/app/data 아님).
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
