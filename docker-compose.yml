services:
  # 개발용 DB. **운영과 같은 엔진(Postgres)** 이어야 한다 — 아래 mysql 로 개발하면
  # SQL 방언 차이가 개발에서 안 잡히고 운영에서 터진다.
  # 개발/운영 DB 분리(2026-08-04 결정)를 클라우드 계정 없이 여기서 끝낸다.
  #   docker compose up -d postgres
  #   python scripts/seed_dev_db.py            ← 로컬 CSV 로 카탈로그를 채운다
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beautyai
      POSTGRES_USER: beautyai
      POSTGRES_PASSWORD: beautyai
    ports:
      # 5432 는 로컬에 이미 다른 Postgres 가 떠 있는 경우가 흔해 피한다.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beautyai -d beautyai"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: beautyai
      MYSQL_USER: beautyai
      MYSQL_PASSWORD: beautyai
      MYSQL_ROOT_PASSWORD: beautyai_root
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pbeautyai_root"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      # 기본값이 **로컬 개발 Postgres** 다(운영과 같은 엔진). 예전 기본값이던 mysql 은
      # 방언이 달라 개발에서 안 잡히는 문제를 만들었고, .env 의 운영 Supabase 를 그대로
      # 상속하던 것은 로컬 작업이 운영 DB 를 치는 사고로 이어졌다(가드로 막았다).
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://beautyai:beautyai@postgres:5432/beautyai}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # 웹 계정 연동. 기본값은 BeautyWEB TokenUtils 의 기본값과 같아 로컬은 설정 없이 붙는다.
      # 로그인 게이트는 로컬에서 꺼둔다 — 익명으로 기능을 그대로 확인할 수 있게(운영은 true).
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_32_BYTE_MINIMUM_JWT_SECRET!}
      REQUIRE_LOGIN: ${REQUIRE_LOGIN:-false}
      WEB_LOGIN_URL: ${WEB_LOGIN_URL:-http://localhost:5174/login}
      WEB_CART_URL: ${WEB_CART_URL:-http://localhost:5174/cart}
      RAKUTEN_APP_ID: ${RAKUTEN_APP_ID:-}
      RAKUTEN_ACCESS_KEY: ${RAKUTEN_ACCESS_KEY:-}
      RAKUTEN_REFERER: ${RAKUTEN_REFERER:-http://127.0.0.1:5173/}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      # LLM 상담용. .env 에 키가 있어도 여기서 넘기지 않으면 컨테이너 안에서는 안 보인다
      # (실제로 이것만 빠져 있어 상담이 계속 지식베이스 폴백으로만 동작했다).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      SKIN_MODEL_PATH: /data/models/skin_efficientnet_b0.pt
      BODY_SKIN_MODEL_PATH: /data/models/body_skin_mobilenet_v3.pt
      PERSONAL_COLOR_MODEL_PATH: /data/models/personal_color_retrain_try2_smooth005.pt
    volumes:
      # 컨테이너 안에서 config.project_root(=parents[3])는 '/'로 해석된다
      # (WORKDIR=/app, 코드=/app/app/...). 따라서 기본 경로 ./data/... 는 /data/... 가 된다.
      # 모델·RAG가 로드되려면 마운트가 반드시 /data 여야 한다(/app/data 아님).
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
  postgres_data:
