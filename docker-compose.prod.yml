# 프로덕션 구성 — 로컬 개발용 docker-compose.yml 과 다른 점:
#   1) 프론트가 Vite 개발서버가 아니라 nginx 정적 서빙(Dockerfile.prod)
#   2) 프론트 nginx 가 /api 를 백엔드로 프록시 → API URL 을 번들에 굽지 않는다
#   3) mysql 컨테이너 없음 — 운영 DB 는 Supabase(DATABASE_URL)
#   4) data/(18GB) 대신 슬림 번들(dist/runtime_data)을 **이미지에 COPY** — 마운트 없음
#
# 사전 준비:
#   python scripts/build_runtime_bundle.py     # dist/runtime_data 생성
#   cp .env.prod.example .env.prod             # 값 채우기
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# 접속: http://localhost:8080  (백엔드는 호스트에 노출하지 않는다 — 프록시로만 접근)

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    # 태그를 밖에서 주입할 수 있게 한다(CI 배포용). 기본값은 로컬 빌드 태그라
    # `up -d --build` 로 돌리던 종전 흐름은 그대로 동작한다.
    # CI 는 러너에서 이미지를 굽고 GHCR 에 올린 뒤, 서버에서는 이 변수를 그 태그로 채워
    # `pull` 만 한다 — EC2 에서 torch 를 빌드하지 않기 위해서다(3.2GB·수 분).
    image: ${AI_BACKEND_IMAGE:-beautyai-backend:local}
    build:
      # 컨텍스트가 저장소 루트다 — 런타임 번들(dist/runtime_data)이 backend/ 밖에 있어서.
      # 루트 .dockerignore 가 data/(18GB) 등을 잘라내 컨텍스트는 작게 유지된다.
      context: .
      dockerfile: backend/Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL 이 필요합니다 — .env.prod 를 확인하세요}
      REDIS_URL: redis://redis:6379/0
      # 프론트와 같은 오리진(nginx 프록시)으로 들어오므로 CORS 는 사실상 불필요하지만,
      # 백엔드를 별도 도메인에 직접 노출할 경우를 위해 남겨둔다.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # 웹 계정 연동. JWT_SECRET 은 BeautyWEB 백엔드와 **같은 값**이어야 핸드오프 티켓이 검증된다.
      # 기본값(CHANGE_ME…)으로 두면 티켓을 아무나 위조할 수 있으므로 운영에서는 필수로 채운다.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 이 필요합니다 — BeautyWEB 과 같은 값을 넣으세요}
      # 프론트 게이트만으로는 API 가 열려 있다 — 운영에서는 켠다.
      REQUIRE_LOGIN: ${REQUIRE_LOGIN:-true}
      WEB_LOGIN_URL: ${WEB_LOGIN_URL:-http://localhost:5174/login}
      # 결과지 QR 이 가리킬 웹 장바구니. 폰이 여는 주소라 반드시 공개 주소여야 한다.
      WEB_CART_URL: ${WEB_CART_URL:-http://localhost:5174/cart}
      RAKUTEN_APP_ID: ${RAKUTEN_APP_ID:-}
      RAKUTEN_ACCESS_KEY: ${RAKUTEN_ACCESS_KEY:-}
      RAKUTEN_REFERER: ${RAKUTEN_REFERER:-http://localhost:8080/}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # 볼륨 마운트 없음 — 런타임 번들은 이미지 안(/data)에 들어 있다(backend/Dockerfile.prod).
    # 마운트에 의존하면 원격 호스트(EC2 등)에 번들을 따로 올려야 하고, 빠뜨리면 기능이
    # 에러 없이 조용히 죽는다(실측 2회). 이미지 하나로 끝나게 한다.
    healthcheck:
      # ⚠ /health(생존) 가 아니라 /ready(준비) 를 본다. 워밍(카탈로그·모델 로딩 ≈20초)이
      # 끝나기 전에 healthy 로 뜨면, 프론트가 먼저 뜨고 **첫 사용자가 30초를 기다린다**(실측).
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 12          # 워밍이 느린 환경(원격 DB 지연)에서도 재시작으로 빠지지 않게 넉넉히
      start_period: 90s
    depends_on:
      redis:
        condition: service_started
    networks:
      default:
      beauty_stack:
        aliases:
          - beautyai-backend

  frontend:
    image: ${AI_FRONTEND_IMAGE:-beautyai-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # 빈 값 = 같은 오리진(/api) → nginx 프록시 경유. 백엔드를 별도 도메인에 둘 때만 채운다.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    # 호스트 포트를 열지 않는다 — 외부 접점은 caddy 하나뿐이다.
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy

  # 리버스 프록시 + 자동 HTTPS(Let's Encrypt). 설정은 ./Caddyfile 참조.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"      # 인증서 갱신(HTTP-01)에 필요 — 닫지 말 것
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서를 보존한다. 없으면 재기동마다 재발급해 Let's Encrypt 한도에 걸린다.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:

networks:
  beauty_stack:
    name: beauty_stack
    external: true
