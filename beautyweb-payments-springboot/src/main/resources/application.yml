server:
  port: 8081

spring:
  application:
    name: beautyweb-payments
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/beautyweb-payments;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

paypay:
  environment: ${PAYPAY_ENVIRONMENT:sandbox}
  api-key: ${PAYPAY_API_KEY:}
  api-secret: ${PAYPAY_API_SECRET:}
  merchant-id: ${PAYPAY_MERCHANT_ID:}
  store-id: ${PAYPAY_STORE_ID:beautyai-web}
  terminal-id: ${PAYPAY_TERMINAL_ID:web}
  order-description-prefix: ${PAYPAY_ORDER_DESCRIPTION_PREFIX:BeautyAI}
  content-type: application/json;charset=UTF-8;
  connect-timeout-ms: 5000
  read-timeout-ms: 35000
  base-urls:
    sandbox: https://apigw.sandbox.paypay.ne.jp
    staging: https://apigw.stg.paypay.ne.jp
    production: https://apigw.paypay.ne.jp
