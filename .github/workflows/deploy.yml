# AI 자동배포 — CI 가 통과하면 서버에서 바로 재빌드·재기동한다.
#
# **서버에 설치한 self-hosted 러너에서 실행된다**(runs-on: self-hosted).
# 그래서 필요한 게 거의 없다: S3·IAM 키·GHCR 토큰·SSH 키가 전부 불필요하다.
# 러너가 GitHub 로 **바깥으로** 접속해 작업을 받아오므로 보안그룹에 인바운드 구멍도 안 뚫는다.
#
# 왜 이렇게 바꿨나(2026-08-03):
#   처음엔 러너에서 이미지를 굽고 GHCR 로 보내는 구조로 짰다. EC2 에서 torch 빌드가
#   안 된다고 봤기 때문인데, 그 근거였던 DEPLOY_READY_CHECKLIST 의 "15분 내 실패" 는
#   **로컬 PC** 이야기였다. 실제 서버에는 4코어·15GB 에 6.4GB 빌드 캐시까지 있고
#   현재 돌고 있는 이미지도 서버에서 구운 것이다. 준비물만 늘리는 구조였다.
#
# 유일한 설정: 저장소 Variables 의 DEPLOY_BRANCH (없으면 배포가 항상 건너뛰어진다).
name: Deploy AI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-ai
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == vars.DEPLOY_BRANCH)
    environment: production
    env:
      # 실제로 서비스가 떠 있는 디렉터리. **여기서 빌드해야** 한다:
      #  - .env.prod(비밀값)와 dist/runtime_data(373MB 번들)가 여기에만 있고
      #  - compose 프로젝트명이 디렉터리명에서 나온다(beautyai_project).
      # 러너 작업공간에서 그냥 띄우면 프로젝트명이 달라져 **두 번째 스택**이 뜬다.
      DEPLOY_DIR: /home/ubuntu/BeautyAI_project
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 은 기본 브랜치를 체크아웃하므로, 실제로 통과한 커밋을 집는다.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: 소스를 배포 디렉터리로 반영
        run: |
          set -euo pipefail
          test -d "$DEPLOY_DIR" || { echo "::error::$DEPLOY_DIR 가 없습니다"; exit 1; }
          # --delete 는 쓰지 않는다. 저장소에 없지만 서버에만 있는 것들(.env.prod,
          # dist/runtime_data, beautyai.db, 백업들)을 지워버리기 때문이다.
          rsync -a --exclude='.git/' "$GITHUB_WORKSPACE"/ "$DEPLOY_DIR"/
          echo "반영: $(git -C "$GITHUB_WORKSPACE" log -1 --oneline)"

      - name: 런타임 번들 확인
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # Dockerfile.prod 의 빌드 가드와 같은 검사를 미리 한다(여기서 걸리면 원인이 명확하다).
          test -d dist/runtime_data/models
          test -s dist/runtime_data/manifests/amazon_dead_asins.txt
          test -s dist/runtime_data/manifests/amazon_asin_status.json
          echo "번들 $(du -sh dist/runtime_data | cut -f1) / 매니페스트 $(ls dist/runtime_data/manifests | wc -l)개"
          # 번들은 git 에 없어서 이 워크플로가 갱신하지 못한다. 낡았는지 눈으로 잡으라고
          # 최신 파일 날짜를 남긴다 — 모델·매니페스트를 바꿨으면 서버에 직접 올려야 한다.
          echo "번들 최신 파일: $(find dist/runtime_data -type f -printf '%TY-%Tm-%Td %TH:%TM  %P\n' | sort -r | head -1)"

      - name: 재빌드·재기동
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # ⚠ -p 는 현재 돌고 있는 스택의 프로젝트명과 정확히 같아야 한다(실측: beautyai_project).
          #   다르면 기존 스택을 갱신하는 대신 두 번째 스택이 뜨고, Caddy 가 이미 80/443 을
          #   잡고 있으므로 새 스택은 뜨다 말고 서비스는 옛 버전 그대로 남는다.
          docker compose -p beautyai_project -f docker-compose.prod.yml --env-file .env.prod up -d --build
          docker compose -p beautyai_project -f docker-compose.prod.yml --env-file .env.prod ps

      - name: 준비 상태 확인
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          C="docker compose -p beautyai_project -f docker-compose.prod.yml --env-file .env.prod"
          # ⚠ /health(생존)가 아니라 /ready(준비)를 본다. 카탈로그·모델 워밍이 ≈20초 걸리는데
          #   그 전에 성공으로 판정하면 첫 사용자가 30초를 기다린다.
          for i in $(seq 1 30); do
            if $C exec -T backend python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/ready')" 2>/dev/null; then
              echo "ready OK ($((i*10))s)"; exit 0
            fi
            sleep 10
          done
          echo "::error::/ready 가 300초 안에 200 을 주지 않았습니다"
          $C logs --tail 50 backend || true
          exit 1

      - name: 옛 이미지 정리
        if: always()
        # 배포마다 4.5GB 이미지가 새로 생긴다. dangling(태그 없는) 것만 지운다 —
        # 돌고 있는 이미지는 건드리지 않는다.
        run: docker image prune -f | tail -1
